---
name: CI
on: [push, pull_request, workflow_dispatch]
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
        with:
          set-safe-directory: ${{ github.workspace }}
      # cliffano/studio:3.2.0 is amd64 only, so it has to be emulated on the arm64 runner
      # TODO: once image is bumped to a multi-arch cliffano/studio version, remove
      #       this setup-qemu-action step and DOCKER_DEFAULT_PLATFORM below
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'arm64'
        with:
          platforms: amd64
      - uses: cliffano/command-docker-action@v2.0.0
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        with:
          image: cliffano/studio:3.2.0
          command: 'make deps ci arch=${{ matrix.arch }}'
