---
name: Publish Docker Base
'on':
  push:
    tags:
      - '*'
jobs:
  build:
    strategy:
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v7
      # cliffano/studio:3.2.0 is amd64 only, so it has to be emulated on the arm64 runner
      # TODO: once image is bumped to a multi-arch cliffano/studio version, remove
      #       this setup-qemu-action step and DOCKER_DEFAULT_PLATFORM below
      - uses: docker/setup-qemu-action@v4
        if: matrix.arch == 'arm64'
        with:
          platforms: amd64
      - uses: docker/login-action@v4
        with:
          username: cliffano
          password: ${{ secrets.STUDIO_DOCKERHUB_TOKEN }}
      - uses: cliffano/command-docker-action@v2.1.0
        env:
          DOCKER_DEFAULT_PLATFORM: linux/amd64
        with:
          image: cliffano/studio:3.2.0
          shell: bash
          extra_args: '-v ~/.docker/config.json:/root/.docker/config.json:ro'
          command: >
            make deps clean stage lint build-docker-base arch=${{ matrix.arch }} &&

            cat logs/packer-docker-base.log &&

            docker --version &&

            docker info  &&

            docker inspect cliffano/base &&

            make publish-docker-base arch=${{ matrix.arch }}
  manifest:
    needs: build
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@v7
      - uses: docker/login-action@v4
        with:
          username: cliffano
          password: ${{ secrets.STUDIO_DOCKERHUB_TOKEN }}
      - run: make publish-docker-base-manifest
