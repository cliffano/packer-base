---
- hosts: localhost

  roles:
    - andrewrothstein.yq

  tasks:

    - ansible.builtin.apt:
        pkg:
          - jq
          - libicu-dev # needed by cyclonedx
          - net-tools # for netstat et al
          - shellcheck
          - telnet
          - vim
          - zip

    - ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/brew install cyclonedx/cyclonedx/cyclonedx-cli
    # Install cdxgen via npm rather than brew, the brew formula pulls in
    # dotnet, ruby, trivy, and sourcekitten which add GBs to the image
    - ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/brew install node
    - ansible.builtin.command: /home/linuxbrew/.linuxbrew/bin/npm install -g @cyclonedx/cdxgen

    - ansible.builtin.file:
        path: /root/.local/bin
        state: directory
        mode: '0755'
